plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def configuredApiBaseUrl = project.findProperty('CROPORA_API_BASE_URL')
        ?.toString()
        ?.trim()
def croporaApiBaseUrl = configuredApiBaseUrl ?: 'http://10.0.2.2:8000/'

android {
    namespace 'com.cropora'
    compileSdk 34

    defaultConfig {
        applicationId "com.cropora"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        buildConfigField 'String', 'API_BASE_URL', "\"${croporaApiBaseUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
}